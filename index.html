<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>powerpoint Seminar Group 6</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080b20;
        --surf: #171d3b;
        --vio: #7c3aed;
        --cy: #20d9ff;
        --li: #b7ff3c;
        --tx: #f4f7ff;
        --co: #ff718a;
        --vio-t: #a98bff;
        --font: "Poppins", "Montserrat", "Segoe UI", system-ui, sans-serif;
        --math: "Poppins", "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: #05071a; overflow: hidden;
        font-family: var(--font); color: var(--tx); font-weight: 500;
      }
      button { font-family: inherit; }
      #stage {
        position: absolute; left: 0; top: 0;
        width: 1920px; height: 1080px;
        transform-origin: 0 0;
        background: var(--bg); overflow: hidden;
      }
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(1100px 700px at 88% 6%, rgba(124, 58, 237, 0.38), transparent 62%),
          radial-gradient(900px 600px at 6% 100%, rgba(32, 217, 255, 0.17), transparent 62%),
          linear-gradient(180deg, #080b20, #0b1032);
        transition: opacity 0.6s;
      }
      #bg::before {
        content: ""; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(32, 217, 255, 0.065) 2px, transparent 2px),
          linear-gradient(90deg, rgba(32, 217, 255, 0.065) 2px, transparent 2px);
        background-size: 96px 96px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 85%);
        mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 85%);
      }
      .pt {
        position: absolute; font-weight: 800;
        color: rgba(244, 247, 255, 0.09); font-family: var(--math);
        animation: drift var(--d, 30s) linear infinite;
        animation-delay: var(--dl, 0s);
      }
      @keyframes drift {
        from { transform: translateY(40px) rotate(0); }
        50% { transform: translateY(-40px) rotate(6deg); }
        to { transform: translateY(40px) rotate(0); }
      }
      body.calm .pt { opacity: 0.25; }
      body.calm #bg { opacity: 0.7; }

      /* ---------- HUD ---------- */
      #hud {
        position: absolute; left: 0; right: 0; top: 0;
        height: 122px; padding: 22px 48px;
        display: flex; align-items: center;
        z-index: 20; transition: opacity 0.3s;
      }
      .hud-left { display: flex; gap: 16px; align-items: center; }
      .bolt {
        display: flex; align-items: center; gap: 12px;
        background: var(--surf); border: 3px solid var(--vio);
        border-radius: 20px; padding: 8px 18px 8px 14px;
        color: var(--tx); cursor: pointer; min-height: 64px;
      }
      .bolt:hover { background: #1f2750; }
      .boltTxt {
        display: flex; flex-direction: column; align-items: flex-start;
        font-size: 17px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.15;
      }
      .boltTxt b { font-size: 22px; color: var(--li); letter-spacing: 0.04em; font-weight: 800; }
      .tbtn .boltTxt { font-size: 19px; letter-spacing: 0.12em; }
      #stageId {
        position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 22px; font-weight: 700; letter-spacing: 0.14em;
        color: rgba(244, 247, 255, 0.8); text-transform: uppercase;
        max-width: 460px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; text-align: center;
      }
      #stageId b { color: var(--cy); font-weight: 800; }

      #dock { display: flex; gap: 14px; align-items: center; margin-left: auto; transition: opacity 0.3s; }
      body.spot #dock { opacity: 0.22; }
      body.spot #dock:hover, body.spot #dock:focus-within { opacity: 1; }
      .dockbtn {
        display: flex; align-items: center; gap: 10px;
        font-size: 22px; font-weight: 800; letter-spacing: 0.08em;
        padding: 10px 18px; min-height: 64px; border-radius: 18px;
        border: 3px solid var(--vio); background: var(--surf); color: var(--tx);
        cursor: pointer; transition: transform 0.12s, box-shadow 0.2s, background 0.2s; font-family: inherit;
      }
      .dockbtn svg { width: 26px; height: 26px; }
      .dockbtn:hover { transform: translateY(-2px); background: #1f2750; }
      .dockbtn.game { border-color: var(--li); color: var(--li); }
      .dockbtn.game:hover { box-shadow: 0 8px 28px rgba(183, 255, 60, 0.35); }
      .dockbtn.practice { border-color: var(--cy); color: var(--cy); }
      .dockbtn.practice:hover { box-shadow: 0 8px 28px rgba(32, 217, 255, 0.35); }
      .dockbtn.video { border-color: var(--co); color: var(--co); }
      .dockbtn.video:hover { box-shadow: 0 8px 28px rgba(255, 113, 138, 0.35); }
      .dockbtn.presentation { border-color: var(--vio-t); color: var(--vio-t); }
      .dockbtn.presentation:hover { box-shadow: 0 8px 28px rgba(169, 139, 255, 0.35); }

      /* ---------- Bottom Bar ---------- */
      #bar {
        position: absolute; left: 48px; right: 48px; bottom: 20px;
        min-height: 88px; display: flex; align-items: center; justify-content: space-between;
        gap: 18px; z-index: 20; transition: opacity 0.3s; flex-wrap: wrap;
      }
      #bar .grp { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      
      #scene {
        position: absolute; left: 90px; right: 90px; top: 128px; bottom: 110px;
        z-index: 5; display: flex; flex-direction: column;
      }
      #cue {
        position: absolute; left: 50%; top: 24px; transform: translate(-50%, -30px);
        z-index: 30; font-size: 44px; font-weight: 800; letter-spacing: 0.1em;
        color: #080b20; background: var(--cy); padding: 12px 44px;
        border-radius: 999px; opacity: 0; pointer-events: none;
        transition: all 0.35s; box-shadow: 0 0 50px rgba(32, 217, 255, 0.45);
      }
      #cue.show { opacity: 1; transform: translate(-50%, 0); }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(3, 4, 14, 0.82) 100%);
        opacity: 0; transition: opacity 0.4s;
      }
      body.spot #vignette { opacity: 1; }
      body.spot #hud, body.spot #bar { opacity: 0.22; }
      body.spot #hud:hover, body.spot #bar:hover, body.spot #hud:focus-within, body.spot #bar:focus-within { opacity: 1; }
      body.spot .pt { opacity: 0; }
      body.hide-timer .timer { display: none !important; }
      body.spot .spotbtn { border-color: var(--cy); color: var(--cy); }

      .btn {
        font-size: 28px; font-weight: 750; padding: 18px 40px;
        border-radius: 18px; border: 3px solid var(--vio);
        background: var(--vio); color: #fff; cursor: pointer; letter-spacing: 0.03em;
        transition: transform 0.12s, box-shadow 0.2s, background 0.2s; line-height: 1.1;
      }
      .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124, 58, 237, 0.45); }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; }
      .btn.ghost { background: transparent; border-color: rgba(244, 247, 255, 0.4); color: var(--tx); }
      .btn.cy { background: var(--cy); border-color: var(--cy); color: #06102a; }
      .btn.li { background: var(--li); border-color: var(--li); color: #0a1304; }
      .btn.coral { background: var(--co); border-color: var(--co); color: #2a0710; }
      .btn.sm { font-size: 22px; padding: 12px 24px; border-radius: 14px; }
      .btn.big { font-size: 34px; padding: 22px 54px; border-radius: 22px; font-weight: 800; }
      .btn.startbtn { font-size: 64px; padding: 36px 120px; border-radius: 36px; font-weight: 900; letter-spacing: 0.1em; }
      .btn.on { border-color: var(--cy); color: var(--cy); }
      .btn kbd { font-size: 0.62em; opacity: 0.7; font-weight: 600; margin-left: 8px; border: 2px solid currentColor; border-radius: 8px; padding: 1px 8px; }
      :focus-visible { outline: 5px solid var(--cy); outline-offset: 4px; }
      .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

      /* --- Math Wrapping Fix --- */
      .mx {
        font-family: var(--math); font-weight: 700;
        white-space: normal;
        word-break: break-word;
        letter-spacing: 0.01em;
      }
      .dg .mx, .dg .cell { white-space: nowrap; word-break: normal; }
      
      sup { font-size: 0.6em; line-height: 0; vertical-align: 0.62em; font-weight: 800; }
      .c-cy { color: var(--cy); }
      .c-li { color: var(--li); }
      .c-vi { color: var(--vio-t); }
      .c-co { color: var(--co); }
      h1, h2, h3, p { margin: 0; }
      .title { font-size: 66px; font-weight: 850; line-height: 1.02; text-transform: uppercase; letter-spacing: -0.005em; }
      .kicker { font-size: 26px; font-weight: 700; letter-spacing: 0.2em; color: var(--cy); text-transform: uppercase; }
      .tag { font-size: 30px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cy); }
      .panel { background: var(--surf); border: 3px solid rgba(124, 58, 237, 0.55); border-radius: 30px; padding: 30px 38px; }
      .panel.cyb { border-color: var(--cy); }
      .panel.lib { border-color: var(--li); }
      .lab { font-size: 22px; font-weight: 700; letter-spacing: 0.18em; color: rgba(244, 247, 255, 0.7); text-transform: uppercase; }
      .sup-note { font-size: 26px; font-weight: 600; color: rgba(244, 247, 255, 0.85); }
      .illus { display: inline-block; font-size: 20px; font-weight: 700; letter-spacing: 0.14em; padding: 6px 18px; border: 2px dashed var(--cy); color: var(--cy); border-radius: 999px; }
      .hintbox { margin-top: 18px; padding: 16px 26px; border: 3px dashed var(--cy); border-radius: 20px; font-size: 28px; font-weight: 600; color: var(--cy); background: rgba(32, 217, 255, 0.07); }

      @keyframes rise { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }
      @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 70% { transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(32, 217, 255, 0.55); } 50% { box-shadow: 0 0 0 14px rgba(32, 217, 255, 0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .enter .rise { animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
      .new { animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .fade { animation: rise 0.5s both; }
      .skip * { animation-duration: 0.01s !important; animation-delay: 0s !important; }

      /* ---------- Scenes ---------- */
      .s1 .wrap { position: relative; height: 100%; display: grid; grid-template-columns: 1050px 1fr; gap: 20px; align-items: center; }
      .hero { font-size: 136px; font-weight: 900; line-height: 0.94; letter-spacing: -0.02em; display: flex; flex-direction: column; margin: 18px 0 26px; }
      .hero .l2 { color: var(--cy); text-shadow: 0 0 60px rgba(32, 217, 255, 0.5); }
      .hero .l3 { background: linear-gradient(90deg, #fff, var(--vio-t)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .tagline { font-size: 38px; font-weight: 600; margin-bottom: 38px; color: rgba(244, 247, 255, 0.92); }
      .s1 .right { display: flex; flex-direction: column; align-items: center; gap: 26px; position: relative; }
      .bigexpr { font-size: 84px; display: flex; gap: 26px; align-items: baseline; }
      .term { display: inline-block; animation: assemble 1.5s cubic-bezier(0.2, 0.9, 0.2, 1) both; animation-delay: var(--td, 0s); }
      @keyframes assemble { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--dr, 20deg)) scale(0.6); } to { opacity: 1; transform: none; } }
      .subexpr { font-size: 56px; color: var(--vio-t); }
      .zero { font-size: 34px; font-weight: 700; padding: 10px 26px; border: 3px solid var(--cy); border-radius: 999px; color: var(--cy); }

      .s2 .head { display: flex; justify-content: space-between; align-items: flex-end; }
      .s2 svg { width: 1740px; height: 560px; display: block; margin-top: 6px; }
      .node { cursor: pointer; }
      .node:focus-visible circle.nc { stroke: #fff; stroke-width: 8; }
      .node text { font-family: var(--font); }
      .s2 .mission { font-size: 38px; font-weight: 650; max-width: 1250px; line-height: 1.25; }

      .s3 .cols { display: grid; grid-template-columns: 1020px 1fr; gap: 44px; height: 100%; }
      .s3 .q { font-size: 50px; font-weight: 800; line-height: 1.12; transition: all 0.4s; }
      .s3 .q.dim { font-size: 34px; opacity: 0.55; }
      .s3 .stack { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
      .eqline { font-size: 44px; }
      .challenge { font-size: 50px; font-weight: 850; line-height: 1.14; color: var(--li); }
      .s3 svg { width: 100%; height: auto; }
      .curve { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.6s 0.3s forwards; }

      .s4 .top { display: grid; grid-template-columns: 1fr 760px; gap: 30px; }
      .s4 .big { font-size: 68px; }
      .s4 .note { font-size: 32px; font-weight: 650; margin-top: 16px; color: var(--cy); }
      .algo { display: flex; align-items: center; gap: 16px; margin-top: 24px; }
      .chip { font-size: 46px; font-weight: 850; letter-spacing: 0.04em; padding: 22px 34px; border-radius: 22px; background: var(--surf); border: 3px solid var(--vio); }
      .chip.a1 { border-color: var(--cy); color: var(--cy); }
      .arrow { font-size: 46px; color: var(--vio-t); font-weight: 800; }
      .remind { font-size: 34px; font-weight: 650; margin-top: 20px; }

      .dg { --cw: 158px; --fs: 52px; font-size: var(--fs); font-family: var(--math); font-weight: 700; }
      .grow { display: grid; grid-template-columns: calc(var(--cw) * 2) repeat(4, var(--cw)); align-items: center; min-height: calc(var(--fs) * 1.5); }
      .cell { text-align: center; white-space: nowrap; padding: 0 2px; border-radius: 12px; transition: color 0.3s, background 0.3s; }
      .cell.hl { color: var(--cy); background: rgba(32, 217, 255, 0.12); }
      .cell.fin { color: var(--li); background: rgba(183, 255, 60, 0.1); }
      .gut { text-align: right; padding-right: 22px; white-space: nowrap; }
      .gm { color: var(--cy); font-weight: 800; }
      .qrow .cell { font-size: 1.05em; }
      .qrow.fin .cell { color: var(--li); }
      .rule { min-height: 20px; }
      .rule .cells { grid-column: 2/6; border-top: 6px solid rgba(244, 247, 255, 0.85); margin-top: 4px; }
      .dvd .gut { border-right: 8px solid var(--vio); padding-right: 26px; border-bottom-left-radius: 0; color: var(--vio-t); }
      .dvd .cellwrap { grid-column: 2/6; display: grid; grid-template-columns: repeat(4, var(--cw)); border-top: 8px solid var(--vio); }
      .dvs .hl, .dvs.on { color: var(--cy); }
      .dvs.on { background: rgba(32, 217, 255, 0.12); border-radius: 12px; }
      .dg.small { --cw: 112px; --fs: 36px; }
      .dg.mini { --cw: 92px; --fs: 30px; }

      .s5 .cols { display: grid; grid-template-columns: 1000px 1fr; gap: 24px; height: 100%; }
      .dots { display: flex; gap: 10px; margin-bottom: 14px; }
      .dots i { width: 54px; height: 12px; border-radius: 6px; background: rgba(244, 247, 255, 0.2); }
      .dots i.d { background: var(--li); }
      .dots i.c { background: var(--cy); }
      .callout .stg { font-size: 26px; font-weight: 850; letter-spacing: 0.16em; color: var(--cy); }
      .callout .calc { font-size: 32px; margin: 10px 0; line-height: 1.3; }
      .callout .note { font-size: 24px; font-weight: 600; line-height: 1.3; }
      .flip { margin-top: 14px; padding: 12px 18px; border: 3px solid var(--cy); border-radius: 18px; font-size: 28px; background: rgba(32, 217, 255, 0.08); }
      .flip .t { font-size: 18px; font-weight: 800; letter-spacing: 0.14em; color: var(--cy); display: block; margin-bottom: 4px; font-family: var(--font); }
      .result { display: flex; gap: 20px; margin-top: 14px; font-size: 34px; }
      .result div { padding: 12px 20px; border: 3px solid var(--li); border-radius: 20px; color: var(--li); background: rgba(183, 255, 60, 0.08); }
      .ctrls { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }

      .s6 .cols { display: grid; grid-template-columns: 790px 1fr; gap: 34px; height: 100%; }
      .s6 .qt { font-size: 70px; font-weight: 900; color: var(--cy); line-height: 1; }
      .s6 .prompt { font-size: 34px; font-weight: 650; margin: 12px 0 18px; }
      .opts { display: flex; flex-direction: column; gap: 16px; }
      .opt { display: flex; align-items: center; gap: 22px; text-align: left; font-size: 36px; font-weight: 700; color: var(--tx); background: var(--surf); border: 4px solid rgba(124, 58, 237, 0.6); border-radius: 24px; padding: 18px 28px; cursor: pointer; transition: all 0.2s; line-height: 1.2; }
      .opt:hover:not(:disabled) { border-color: var(--cy); transform: translateX(6px); }
      .opt .lt { flex: 0 0 74px; height: 74px; border-radius: 20px; background: var(--vio); display: grid; place-items: center; font-size: 42px; font-weight: 900; }
      .opt.sel { border-color: var(--cy); background: rgba(32, 217, 255, 0.1); }
      .opt.ok { border-color: var(--li); background: rgba(183, 255, 60, 0.12); }
      .opt.ok .lt { background: var(--li); color: #0a1304; }
      .opt.bad { border-color: var(--co); background: rgba(255, 113, 138, 0.1); }
      .opt.bad .lt { background: var(--co); color: #2a0710; }
      .opt .mk { margin-left: auto; font-size: 30px; font-weight: 850; }
      .opt:disabled { cursor: default; opacity: 1; }
      .fb { margin-top: 16px; padding: 20px 28px; border-radius: 22px; font-size: 32px; font-weight: 600; line-height: 1.3; border: 3px solid; }
      .fb.ok { border-color: var(--li); background: rgba(183, 255, 60, 0.1); }
      .fb.bad { border-color: var(--co); background: rgba(255, 113, 138, 0.09); }
      .fb b { font-weight: 850; letter-spacing: 0.06em; }

      .s7 .cols { display: grid; grid-template-columns: 960px 1fr; gap: 36px; height: 100%; }
      .tabs { display: flex; gap: 14px; margin-bottom: 16px; }
      .tab { font-size: 24px; font-weight: 750; letter-spacing: 0.08em; padding: 12px 24px; border-radius: 14px; border: 3px solid rgba(244, 247, 255, 0.3); background: transparent; color: var(--tx); cursor: pointer; }
      .tab.on { background: var(--vio); border-color: var(--vio); }
      .work { display: flex; flex-direction: column; gap: 12px; font-size: 38px; }
      .work .ln { padding: 10px 20px; border-radius: 16px; background: rgba(244, 247, 255, 0.05); }
      .badt { color: var(--co); text-decoration: underline wavy var(--co); text-underline-offset: 8px; }
      .goodt { color: var(--li); }
      .s7 .qt { font-size: 62px; font-weight: 900; line-height: 1; color: var(--cy); }
      .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
      .cats .opt { font-size: 30px; padding: 16px 20px; }

      .timer { text-align: center; padding: 18px 20px; border-radius: 30px; background: var(--surf); border: 3px solid var(--vio); }
      .tnum { font-size: 190px; font-weight: 900; line-height: 1; font-family: var(--font); font-variant-numeric: tabular-nums; color: var(--tx); }
      .tstat { font-size: 28px; font-weight: 800; letter-spacing: 0.2em; min-height: 36px; color: rgba(244, 247, 255, 0.7); }
      .timer.low { border-color: var(--co); }
      .timer.low .tnum { color: var(--co); }
      .timer.over { border-color: var(--co); background: rgba(255, 113, 138, 0.14); }
      .timer.over .tstat { color: var(--co); font-size: 40px; }
      .timer.run { border-color: var(--cy); }
      .timer.sm .tnum { font-size: 100px; }
      .presets { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
      .presets .btn { padding: 10px 20px; font-size: 24px; }
      .s8 .rtabs { display: flex; gap: 12px; }
      .s8 .rtab { flex: 1; font-size: 22px; font-weight: 750; letter-spacing: 0.06em; padding: 12px 8px; border-radius: 16px; border: 3px solid rgba(244, 247, 255, 0.25); background: transparent; color: var(--tx); cursor: pointer; line-height: 1.1; }
      .s8 .rtab.on { background: var(--vio); border-color: var(--vio); }
      .s8 .rtab.dn { border-color: var(--li); color: var(--li); }
      .s8 .mid { display: grid; grid-template-columns: 1fr 620px; gap: 26px; margin-top: 16px; }
      .s8 .qpanel { min-height: 340px; }
      .s8 .qline { font-size: 42px; font-weight: 800; line-height: 1.15; }
      .s8 .qmath { font-size: 62px; margin-top: 12px; color: var(--cy); }
      .s8 .ans { margin-top: 14px; padding: 14px 24px; border: 3px solid var(--li); border-radius: 20px; font-size: 36px; font-weight: 800; color: var(--li); background: rgba(183, 255, 60, 0.09); }
      .s8 .ctl { display: flex; gap: 14px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
      .teams { display: grid; gap: 22px; }
      .team { position: relative; background: var(--surf); border: 4px solid rgba(244, 247, 255, 0.2); border-radius: 28px; padding: 14px 24px; display: grid; grid-template-columns: 1fr auto; align-items: center; cursor: pointer; }
      .team.act { border-color: var(--cy); box-shadow: 0 0 40px rgba(32, 217, 255, 0.25); }
      .team .nm { font-size: 34px; font-weight: 850; letter-spacing: 0.1em; }

    <script>
      (() => {
        "use strict";
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const M = (s) => String(s).replace(/\^(\d)/g, "<sup>$1</sup>").replace(/-/g, "−");
        const B = (act, label, cls = "", data = "") => `<button class="btn ${cls}" data-act="${act}" ${data}>${label}</button>`;

        const EX = { dvd: [2, -5, 0, -2], dsr: [2, -1, -1], q: [1, -2], r: [-1, -4] };
        const BOSS = { dvd: [3, 2, -7, 5], dsr: [1, 1, -1], q: [3, -1], r: [-3, 4] };
        const ROWS = {
          dvd: [2, -5, 0, -2],
          p1: [2, -1, -1, null],
          r1: [null, -4, 1, -2],
          p2: [null, -4, 2, 2],
          r2: [null, null, -1, -4],
        };

        function polyDiv(n, d) {
          n = n.slice();
          const q = [];
          while (n.length >= d.length) {
            const c = n[0] / d[0];
            q.push(c);
            for (let i = 0; i < d.length; i++) n[i] -= c * d[i];
            n.shift();
          }
          return { q, r: n };
        }
        const polyMul = (a, b) => {
          const r = Array(a.length + b.length - 1).fill(0);
          a.forEach((x, i) => b.forEach((y, j) => (r[i + j] += x * y)));
          return r;
        };
        const polyAdd = (a, b) => {
          const L = Math.max(a.length, b.length);
          const A = Array(L - a.length).fill(0).concat(a);
          const Bb = Array(L - b.length).fill(0).concat(b);
          return A.map((x, i) => x + Bb[i]);
        };
        const polySub = (a, b) => polyAdd(a, b.map((x) => -x));
        const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
        const degOf = (p) => {
          const t = p.slice();
          while (t.length && t[0] === 0) t.shift();
          return t.length - 1;
        };
        const trim = (p) => {
          const t = p.slice();
          while (t.length > 1 && t[0] === 0) t.shift();
          return t;
        };

        function verify() {
          const out = [], t = (n, ok) => out.push({ n, ok: !!ok });
          for (const [nm, P] of [["example", EX], ["boss", BOSS]]) {
            const { q, r } = polyDiv(P.dvd, P.dsr);
            t(nm + " quotient", eq(q, P.q));
            t(nm + " remainder", eq(trim(r), P.r));
            t(nm + " identity", eq(trim(polyAdd(polyMul(P.dsr, P.q), P.r)), P.dvd));
            t(nm + " remainder degree < divisor degree", degOf(P.r) < degOf(P.dsr));
          }
          const p1 = polyMul(EX.dsr, [1]);
          t("p1 row", eq(p1, ROWS.p1.slice(0, 3)));
          const r1 = polySub(EX.dvd, p1.concat([0])).slice(1);
          t("r1 row", eq(r1, ROWS.r1.slice(1)));
          const p2 = polyMul(EX.dsr, [-2]);
          t("p2 row", eq(p2, ROWS.p2.slice(1, 4)));
          const r2 = polySub(r1, p2).slice(1);
          t("r2 row", eq(r2, ROWS.r2.slice(2)));
          t("dividend row has 0x", ROWS.dvd[2] === 0);
          const b1 = polyMul(BOSS.dsr, [3]);
          t("boss product 1", eq(b1, [3, 3, -3]));
          const bs1 = polySub(BOSS.dvd, b1.concat([0])).slice(1);
          t("boss subtraction 1", eq(bs1, [-1, -4, 5]));
          const b2 = polyMul(BOSS.dsr, [-1]);
          t("boss product 2", eq(b2, [-1, -1, 1]));
          t("boss remainder", eq(polySub(bs1, b2).slice(1), [-3, 4]));
          t("boss expanded product", eq(polyMul(BOSS.dsr, BOSS.q), [3, 2, -4, 1]));
          return out;
        }

        const KEY = "pca.v1";
        const DEF = () => ({
          scene: 1, done: {}, fired: {}, visited: { 1: 1 },
          teams: 2, active: 0, scores: [0, 0, 0], bonus: 1, preset: 30,
          s3: 0, s4: 0,
          s5: { step: 0, full: false },
          s6: { pick: null, expl: false },

              render(true);
              return;
            case "sound": S.ui.sound = !S.ui.sound; sfx("ok"); break;
            case "full": fullscreen(); return;
            case "spot": S.ui.spot = !S.ui.spot; break;
            case "auto": S.ui.auto = !S.ui.auto; break;
            case "markDone": S.done[S.scene] = !S.done[S.scene]; S.fired[S.scene] = true; break;
            case "resetScores": S.scores = [0, 0, 0]; break;
            case "resetSession":
              confirmBox("Reset the whole session? Progress, scores and settings for this lesson will be cleared.", resetSession);
              return;
            case "cno":
              $("#confirm").classList.remove("open");
              confirmCb = null;
              return;
            case "cyes":
              $("#confirm").classList.remove("open");
              const cb = confirmCb;
              confirmCb = null;
              cb && cb();
              return;
            case "prev": prevAct(); return;
            case "next": nextAct(); return;
            case "hint": hintAct(); return;
            case "enter": 
              $("#credits").classList.add("open"); 
              return;
            case "startVidAfterCredits":
              $("#credits").classList.remove("open");
              playStartVideo();
              return;
            case "begin": SC[2].next(); return;
            case "skipVid": finish(1); go(2); return;
            case "game": openExt("game"); return;
            case "practice": openExt("practice"); return;
            case "video": openExt("video"); return;
            case "presentation": openExt("presentation"); return;
            case "s5first": S.s5.step = 0; S.s5.full = false; break;
            case "s5replay": break;
            case "s5full": S.s5.full = true; if (S.s5.step < 7) S.s5.step = 7; break;
            case "s5hide": S.s5.full = false; break;
            case "s6pick": S.s6.pick = d.k; S.s6.expl = false; sfx(d.k === "A" ? "ok" : "bad"); break;
            case "s6try": S.s6.pick = null; S.s6.expl = false; break;
            case "s6expl": S.s6.expl = true; sfx("ok"); break;
            case "s7ex": S.s7.ex = +d.i; hintOn = false; break;
            case "s7pick": S.s7.pick[S.s7.ex] = +d.i; sfx(+d.i === EXS[S.s7.ex].ok ? "ok" : "bad"); break;
            case "s7fix": S.s7.fix[S.s7.ex] = true; sfx("ok"); break;
            case "s8round": S.s8.round = +d.i; T.reset(); cue("DISCUSS WITH YOUR TEAM"); break;
            case "s8reveal": S.s8.rev[S.s8.round] = !S.s8.rev[S.s8.round]; if (S.s8.rev[S.s8.round]) sfx("ok"); break;
            case "s8resetRound": S.s8.rev[S.s8.round] = false; T.reset(); break;
            case "s8nextq": if (S.s8.round < 4) { S.s8.round++; T.reset(); cue("DISCUSS WITH YOUR TEAM"); } break;
            case "teams": S.teams = +d.v; if (S.active >= S.teams) S.active = 0; break;
            case "active": S.active = +d.i; break;
            case "score": Score.add(+d.i, +d.v); return;
            case "bonus": S.bonus = +d.v; break;
            case "preset": T.setPreset(+d.v); return;
            case "tToggle": T.toggle(); render(false); return;
            case "tReset": T.reset(); render(false); return;
            case "tStop": T.stop(); render(false); return;
            case "s9pick": {
              const s = S.s9;
              if (s.ok[s.stage]) return;
              s.pick = +d.i;
              if (+d.i === BQ[s.stage].c) { s.ok[s.stage] = true; sfx("ok"); }
              else sfx("bad");
              break;
            }
            case "s9hint": SC[9].onHint(); break;
            case "s9sol": S.s9.sol = !S.s9.sol; break;
            case "s9mode": S.s9.timer = !S.s9.timer; break;
            case "s11rev": SC[11].next(); break;
            case "s12replay": replayLesson(); return;
            case "s12boss": S.s9 = DEF().s9; S.done[9] = false; S.fired[9] = false; T.reset(); go(9); return;
            default: return;
          }
          render(false);
        }

        document.addEventListener("click", (e) => {
          const b = e.target.closest("[data-act]");
          if (!b || b.disabled) return;
          if (b.dataset.act === "active" && e.target.closest("button")) return;
          act(b.dataset.act, b.dataset);
        });
        document.addEventListener("change", (e) => {
          if (e.target.id === "jump") go(+e.target.value);
        });
        document.addEventListener("keydown", (e) => {
          const t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const k = e.key;
          if ((k === "Enter" || k === " ") && t && t.dataset && t.dataset.act && tag !== "BUTTON") {
            e.preventDefault();
            act(t.dataset.act, t.dataset);
            return;
          }
          if (k === "Escape") {
            if ($("#credits").classList.contains("open")) { $("#credits").classList.remove("open"); return; }
            if ($("#startvid").classList.contains("open")) { act("skipVid", {}); return; }
            if ($("#confirm").classList.contains("open")) { act("cno", {}); return; }
            if ($("#pausev").classList.contains("open")) return;
            if ($("#nav").classList.contains("open") || $("#teacher").classList.contains("open")) { closeOverlays(); return; }
            if (S.ui.spot) { S.ui.spot = false; render(false); }
            return;
          }
          const ovOpen =
            $("#nav").classList.contains("open") || $("#confirm").classList.contains("open") ||
            $("#pausev").classList.contains("open") || $("#startvid").classList.contains("open") ||
            $("#credits").classList.contains("open");
          if (k === "l" || k === "L") { toggleNav(); return; }
          if (ovOpen) return;
          switch (k) {
            case "ArrowRight": e.preventDefault(); nextAct(); break;
            case "ArrowLeft": e.preventDefault(); prevAct(); break;
            case " ":
              if (tag !== "BUTTON" && (S.scene === 8 || (S.scene === 9 && S.s9.timer))) {
                e.preventDefault();
                T.toggle();
                render(false);
              }
              break;
            case "h": case "H": hintAct(); break;
            case "r": case "R": if (S.scene === 1) introSkip = false; render(true); break;
            case "f": case "F": fullscreen(); break;
            case "g": case "G": openExt("game"); break;
            case "p": case "P": openExt("practice"); break;
            case "v": case "V": openExt("video"); break;
            case "s": case "S": openExt("presentation"); break;
          }
        });

        function fit() {
          const s = Math.min(innerWidth / 1920, innerHeight / 1080);
          $("#stage").style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
        }
        addEventListener("resize", fit);

        function initBg() {
          const bg = $("#bg"),
            P = ["x²", "−4x", "2x³", "÷", "+0x", "−2", "x−2", "2x²−x−1", "−x−4", "(  )", "−", "3x"];
          bg.innerHTML = P.map((p, i) =>
            `<span class="pt" style="left:${(i * 137) % 1800}px;top:${(i * 211) % 960}px;font-size:${60 + ((i * 37) % 110)}px;--d:${26 + ((i * 7) % 20)}s;--dl:-${(i * 3) % 20}s">${p}</span>`
          ).join("");
        }

        window.PCA = {
          verify, get state() { return S; }, go, act, T, SC, BQ, ROUNDS,
        };

        initBg(); fit();
        T.ms = S.preset * 1000;
        if (S.scene !== 1) S.visited[S.scene] = 1;
        render(true);
        if (CUES[S.scene]) cue(CUES[S.scene]);
      })();
    </script>
  </body>
</html>
